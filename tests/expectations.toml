# Cmd+3 must sit in the Editor context, not the shared Editing set: Ardour prefixes the
# Editing set's action names per editing context (Bindings::relativize), so a LuaAction
# target there can never resolve.
[[binding]]
source_id = "S13-04"
context = "Editor"
key = "Primary-3"
action = "LuaAction/script-19"

